<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>TF CARD</title>

  <!-- PWA / iPhone „Dodaj do ekranu początkowego" -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TF CARD" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ EKRAN BLOKADY / PIN ============ -->
  <div id="lock-screen" class="screen lock-screen">
    <div class="lock-inner">
      <div class="lock-brand">
        <div class="brand-logo">TF</div>
        <!-- Kliknięcie w ten napis przełącza w tryb administratora -->
        <div id="brand-wordmark" class="brand-name" title="">TF CARD</div>
        <div id="lock-sub" class="lock-sub">Wpisz kod PIN</div>
      </div>

      <div id="pin-dots" class="pin-dots"></div>
      <div id="pin-error" class="pin-error"></div>

      <div class="keypad" id="keypad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key key-ghost" id="admin-exit" data-k="admin-exit"></button>
        <button class="key" data-k="0">0</button>
        <button class="key key-ghost" data-k="del">⌫</button>
      </div>

      <div id="storage-mode" class="storage-mode"></div>
    </div>
  </div>

  <!-- ============ APLIKACJA (użytkownik) ============ -->
  <div id="app-screen" class="screen hidden">
    <main id="view-container" class="view-container"></main>
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home"><span class="nav-ico">🏠</span><span>Pulpit</span></button>
      <button class="nav-item" data-view="pay"><span class="nav-ico">⚡</span><span>TF PAY</span></button>
      <button class="nav-item" data-view="cards"><span class="nav-ico">💳</span><span>Karty</span></button>
      <button class="nav-item" data-view="subs"><span class="nav-ico">⭐</span><span>Plany</span></button>
    </nav>
  </div>

  <!-- ============ PANEL ADMINA ============ -->
  <div id="admin-screen" class="screen hidden">
    <main id="admin-container" class="view-container"></main>
  </div>

  <!-- ============ INSTALACJA PWA (iPhone) ============ -->
  <div id="ios-install" class="ios-install hidden">
    <div class="ios-install-card">
      <button class="ios-close" id="ios-close">✕</button>
      <div class="brand-logo small">TF</div>
      <h3>Zainstaluj TF CARD</h3>
      <p>Aby dodać aplikację na ekran początkowy iPhone:</p>
      <ol>
        <li>Dotknij <b>Udostępnij</b> <span class="share-ico">⬆️</span> na dole Safari</li>
        <li>Wybierz <b>„Do ekranu początkowego"</b></li>
        <li>Potwierdź <b>Dodaj</b></li>
      </ol>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Firebase SDK (Firestore + Auth + Analytics) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
